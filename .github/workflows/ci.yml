# macOS PDF Editor CI

name: macOS PDF Editor CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -c debug

      - name: Build (release)
        run: swift build -c release

      - name: Locate release executable
        id: release-bin
        run: echo "path=$(swift build -c release --show-bin-path)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-${{ github.sha }}
          path: ${{ steps.release-bin.outputs.path }}/PDFEditor
          if-no-files-found: error
          retention-days: 7
